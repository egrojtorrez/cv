name: Build & Release CV

on:
  push:
    branches:
      - main

permissions:
  contents: write   # necesario para crear releases

jobs:
  release-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: |
          pip install "rendercv[full]"

      - name: Generate PDFs
        run: |
          # Asegurarnos de que la carpeta dist exista
          mkdir -p dist 
          
          for file in cv/*.yaml; do
            filename=$(basename "$file" .yaml)
            filename_upper=$(echo "$filename" | tr '[:lower:]' '[:upper:]')
            lang="${filename##*_}"
            
            echo "Procesando $file (Idioma: $lang)..."
            rendercv render "$file" -d designs/engineeringresumes.yaml -lc "locales/${lang}.yaml" -pdf "dist/Jorge_Torres_${filename_upper}.pdf" 
          done

      - name: Generate version tag
        id: version
        run: |
          echo "tag=cv-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CV ${{ steps.version.outputs.tag }}
          body: |
            📄 Automated CV build using RenderCV
            - English & Spanish versions
            - Generated on push to main
          files: |
            dist/*.pdf
